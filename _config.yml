# GitHub Pages build settings.
# Everything listed under `exclude` stays in the repo but is NOT published on
# the live website (magnumcpa.com). Keep internal docs, scripts and the
# Cloudflare Worker source here so visitors can't browse them.
exclude:
  - README.md
  - docs/
  - images/README.md
  - images/unused/
  - images/lead-funnel-diagram.png
  - sync.bat
  - update-reviews.bat
  - reviews.xlsx
  - worker/
  - .claude/
  - tools/
  - versions/
