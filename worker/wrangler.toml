name = "magnum-cpa-lead-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# LEADS_KV  — the main site's consultation form. Do not repoint this.
# LIBRARY_KV — the gated video library (videos, gate leads, analytics).
#
# Both live in the company Cloudflare account (glenn@magnumcpa.com). The old
# personal account's LEADS_KV (363eb08d…) was not migrated.
kv_namespaces = [
  { binding = "LEADS_KV", id = "1dcf445a11b343ad8b73d761cd32d44c" },
  { binding = "LIBRARY_KV", id = "b11d57f561e14aec85ad3ea67a1c7e42" }
]

# Flushes the pending-Canopy retry queue and rolls up raw analytics events
# into daily/monthly counters. Runs every 15 minutes.
[triggers]
crons = ["*/15 * * * *"]

[vars]
# Comma-separated list of origins allowed to call this Worker: the live
# website on magnumcpa.com (bare and www), the video library on
# library.magnumcpa.com, plus the GitHub Pages test sites (glenn925 is current;
# glennnnnnn1 is the old account — remove it once magnumcpa.com is live).
#
# The video library frontend must be served from an origin in this list. If it
# is a GitHub Pages project site under the same account, its origin is already
# covered — project pages share the user-site origin — and no change is needed.
# For local development, override this in .dev.vars (gitignored) rather than
# adding localhost here; a `file://` page sends `Origin: null`, which is never
# allowlisted, so use a real static server.
ALLOWED_ORIGINS = "https://magnumcpa.com,https://www.magnumcpa.com,https://library.magnumcpa.com,https://glenn925.github.io,https://glennnnnnn1.github.io"

# Secrets (never put these here — set via `wrangler secret put <NAME>`):
#   TURNSTILE_SECRET_KEY   (already set — required before real launch)
#   ADMIN_PASSWORD_HASH    (video library admin; generate with
#                           `npm run hash-password` in the Video Library repo)
#   ADMIN_TOKEN_SECRET     (video library admin; 32 random bytes, base64)
#   LEAD_WEBHOOK_URL       (optional — POSTs each gate lead as JSON; point it
#                           at Zapier/Make for a live Google Sheet / Excel file)
#   CANOPY_CLIENT_ID       (Phase 2, once you have Canopy API access)
#   CANOPY_CLIENT_SECRET   (Phase 2)
#   CANOPY_API_BASE        (Phase 2 — confirm against real Canopy docs)
#   CANOPY_TOKEN_URL       (Phase 2 — confirm against real Canopy docs)
